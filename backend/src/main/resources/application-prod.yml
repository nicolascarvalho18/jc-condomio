spring:
  datasource:
    # Em hospedagens gerenciadas, como Supabase, prefira informar a URL JDBC
    # completa via SPRING_DATASOURCE_URL. O formato DB_HOST continua atendendo
    # ao Docker Compose local.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:jccondomiodb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:jcuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.jccondomio: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
